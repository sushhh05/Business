<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Biroba Vegetable Suppliers — Daily Billing &amp; Record System</title>
  <meta name="description" content="Biroba Vegetable Suppliers — Daily Billing, Records &amp; Invoicing App" />
  <meta name="theme-color" content="#1f6f43" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Biroba Vegetables" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="Biroba Vegetable Suppliers" />
  
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', 'Noto Sans Devanagari', sans-serif;
      background-color: #f3f6f4;
      color: #1e293b;
    }
    .devanagari {
      font-family: 'Noto Sans Devanagari', 'Inter', sans-serif;
    }
    /* Traditional Bill Book Styling */
    .bill-paper {
      background: #ffffff;
      border: 2px solid #1f6f43;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      overflow: hidden;
    }
    .bill-table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      box-sizing: border-box;
    }
    .bill-table th {
      border: 1.5px solid #1f6f43;
      background-color: #ecf7f0;
      color: #14532d;
      font-weight: 700;
      font-size: 0.65rem;
      letter-spacing: 0.02em;
      padding: 4px 2px;
      text-transform: uppercase;
      box-sizing: border-box;
    }
    .bill-table td {
      border-left: 1.5px solid #1f6f43;
      border-right: 1.5px solid #1f6f43;
      border-bottom: 1px solid #86efac;
      padding: 3.5px 3px;
      font-size: 0.72rem;
      color: #14532d;
      box-sizing: border-box;
      overflow-wrap: break-word;
      word-break: break-word;
    }
    .bill-table tr:last-child td {
      border-bottom: 1.5px solid #1f6f43;
    }
    @media (min-width: 640px) {
      .bill-table th {
        font-size: 0.75rem;
        letter-spacing: 0.03em;
        padding: 6px 8px;
      }
      .bill-table td {
        font-size: 0.85rem;
        padding: 5px 8px;
      }
    }
    .bill-red {
      color: #c81e1e;
    }
    .bill-green {
      color: #166534;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    /* Print Styles */
    @media print {
      body {
        background: #ffffff !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      .print-only-container {
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .bill-paper {
        box-shadow: none !important;
        border: 2px solid #1f6f43 !important;
        margin: 0 auto !important;
        width: 100% !important;
      }
      @page {
        margin: 8mm;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
